server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ls-manager-api
  config:
    import: optional:file:${ENV_FILE:.env}[.properties],optional:file:ls-manager-api/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ls-manager}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: ${LOG_LEVEL:info}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8084}
  jwt:
    secret: ${JWT_SECRET}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Strict}
    domain: ${COOKIE_DOMAIN:}
    access-token-max-age: ${ACCESS_COOKIE_MAX_AGE:15m}
    refresh-token-max-age: ${REFRESH_COOKIE_MAX_AGE:7d}
