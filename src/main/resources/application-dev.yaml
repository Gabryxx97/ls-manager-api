server:
  port: 8084

spring:
  application:
    name: ls-manager-api
  datasource:
    url: jdbc:postgresql://localhost:5432/ls-manager
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate.ddl-auto: update
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hikari:
      maximum-pool-size: 1

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: info
    org.springframework.security.web.csrf: DEBUG

app:
  domain:
    url: http://localhost:8084
  frontend:
    url: http://localhost:3000
  jwt:
    secret: a4cdba5f9d5f460a6daf8a59ae9df46b58703657f16500adb99a009d6867e4147304d1a173a54da64bed00f90dcef1a3bb8c1073bcb545005157af64c9793089
